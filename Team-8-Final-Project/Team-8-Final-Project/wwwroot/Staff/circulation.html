<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circulation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand mb-0 h1">Library Management System - Staff</span>
        <button class="btn btn-outline-light" onclick="logout()">Log out</button>
    </nav>

    <div class="container mt-4">
        <a href="dashboard.html" class="btn btn-link ps-0">&larr; Back to staff dashboard</a>
        <h1>Circulation</h1>

        <ul class="nav nav-tabs mt-3" id="circulationTabs" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#loans-pane">Loans</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#reservations-pane">Reservations</button></li>
        </ul>

        <div class="tab-content border border-top-0 p-3">

            <!-- Loans -->
            <div class="tab-pane fade show active" id="loans-pane">
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Check out a book (new loan)</h5>
                        <form id="addLoanForm" class="row g-2">
                            <div class="col-md-4" id="loanBookCopyPicker"></div>
                            <div class="col-md-4" id="loanUserPicker"></div>
                            <div class="col-md-2"><input type="date" class="form-control" id="loanDueDate" required></div>
                            <div class="col-md-2"><button type="submit" class="btn btn-primary w-100">Check out</button></div>
                        </form>
                    </div>
                </div>
                <div id="loansContainer"><p class="text-muted">Loading loans...</p></div>
            </div>

            <!-- Reservations -->
            <div class="tab-pane fade" id="reservations-pane">
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Add a reservation</h5>
                        <form id="addReservationForm" class="row g-2">
                            <div class="col-md-5" id="reservationBookPicker"></div>
                            <div class="col-md-5" id="reservationUserPicker"></div>
                            <div class="col-md-2"><button type="submit" class="btn btn-primary w-100">Add</button></div>
                        </form>
                    </div>
                </div>
                <div id="reservationsContainer"><p class="text-muted">Loading reservations...</p></div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/pickers.js"></script>
    <script src="circulation.js"></script>

    <script>
        const token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "../login.html";
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "../login.html";
        }
    </script>

</body>
</html>

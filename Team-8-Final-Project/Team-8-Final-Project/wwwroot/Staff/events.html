<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand mb-0 h1">Library Management System - Staff</span>
        <button class="btn btn-outline-light" onclick="logout()">Log out</button>
    </nav>

    <div class="container mt-4">
        <a href="dashboard.html" class="btn btn-link ps-0">&larr; Back to staff dashboard</a>
        <h1>Manage Events</h1>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Add an event</h5>
                <form id="addEventForm" class="row g-2">
                    <div class="col-md-3"><input type="text" class="form-control" id="eventName" placeholder="Name" required></div>
                    <div class="col-md-3"><input type="datetime-local" class="form-control" id="eventDate" required></div>
                    <div class="col-md-2"><input type="text" class="form-control" id="eventLocation" placeholder="Location" required></div>
                    <div class="col-md-2"><input type="number" class="form-control" id="eventMaxCap" placeholder="Max capacity" required></div>
                    <div class="col-md-2"><button type="submit" class="btn btn-primary w-100">Add</button></div>
                    <div class="col-12"><textarea class="form-control" id="eventDescription" placeholder="Description" rows="2"></textarea></div>
                </form>
            </div>
        </div>

        <div id="eventsBanner"></div>
        <div id="eventsContainer"><p class="text-muted">Loading events...</p></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="events.js"></script>

    <script>
        const token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "../login.html";
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "../login.html";
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Fines</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand mb-0 h1">Library Management System - Staff</span>
        <button class="btn btn-outline-light" onclick="logout()">Log out</button>
    </nav>

    <div class="container mt-4">
        <a href="dashboard.html" class="btn btn-link ps-0">&larr; Back to staff dashboard</a>
        <h1>Manage Fines</h1>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Issue a fine</h5>
                <form id="addFineForm" class="row g-2">
                    <div class="col-md-3"><input type="number" class="form-control" id="fineLoanId" placeholder="Loan Id" required></div>
                    <div class="col-md-3"><input type="number" step="0.01" class="form-control" id="fineAmount" placeholder="Amount" required></div>
                    <div class="col-md-3"><input type="date" class="form-control" id="fineIssueDate" required></div>
                    <div class="col-md-3"><button type="submit" class="btn btn-primary w-100">Issue fine</button></div>
                </form>
            </div>
        </div>

        <div id="totalUnpaid" class="mb-3 fs-5"></div>
        <div id="finesContainer"><p class="text-muted">Loading fines...</p></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="fines.js"></script>

    <script>
        const token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "../login.html";
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "../login.html";
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Fine Management</title>
    </head>

    <body>
        <header>
            <nav>
                <h1>Library Management System</h1>

                <ul>
                   <li><a href="dashboard.html">Dashboard</a></li>
                   <li><a href="catalog.html">Catalog</a></li>
                   <li><a href="circulation.html">Circulation</a></li>
                   <li><a href="fines.html">Fines</a></li>
                   <li><a href="reviews.html">Reviews</a></li>
                   <li><a href="events.html">Events</a></li>
                </ul>

                <div>
                   <span>Welcome, Staff</span>
                   <button type="button">Logout</button>
                </div>
            </nav>
        </header>

        <main>
            <section>
               <h2>Fine Management</h2>
               <p>View and manage fines associated with library loans.</p>
            </section>

             <section>
                <h2>Fine Overview</h2>

                <div>
                    <article>
                        <h3>Total Fines</h3>
                        <p>0</p>
                    </article>

                    <article>
                        <h3>Unpaid Fines</h3>
                        <p>0</p>
                    </article>

                    <article>
                        <h3>Paid Fines</h3>
                        <p>0</p>
                    </article>

                    <article>
                        <h3>Total Amount</h3>
                        <p>0.00</p>
                    </article>
                </div>
            </section>

            <section>

                <h2>Search and Filter</h2>

                <div>
                    <label for="fine-search">Search Fines:</label>

                    <input
                        type="text"
                        id="fine-search"
                        placeholder="Search by member or loan ID">

                    <button type="button">Search</button>
                </div>

                <div>
                    <label for="fine-status-filter">
                        Filter by Status:
                    </label>

                    <select id="fine-status-filter">
                        <option value="">All Statuses</option>
                        <option value="Paid">Paid</option>
                        <option value="Unpaid">Unpaid</option>
                        <option value="Dismissed">Dismissed</option>
                    </select>

                    <button type="button">Filter</button>
                </div>

            </section>

        </main>

    </body>
</html>

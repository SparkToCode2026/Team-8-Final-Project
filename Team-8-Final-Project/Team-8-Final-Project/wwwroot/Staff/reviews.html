<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderate Reviews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand mb-0 h1">Library Management System - Staff</span>
        <button class="btn btn-outline-light" onclick="logout()">Log out</button>
    </nav>

    <div class="container mt-4">
        <a href="dashboard.html" class="btn btn-link ps-0">&larr; Back to staff dashboard</a>
        <h1>Moderate Reviews</h1>
        <!-- ReviewController has no "get every review" endpoint - only lookups
             scoped to one book at a time - so this page works one book at a time. -->
        <form id="lookupForm" class="row g-2 mb-3">
            <div class="col-md-3"><input type="number" class="form-control" id="lookupBookId" placeholder="Book Id" required></div>
            <div class="col-md-3"><button type="submit" class="btn btn-primary w-100">Load reviews</button></div>
            <div class="col-md-4 d-flex align-items-center">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="highRatingOnly">
                    <label class="form-check-label" for="highRatingOnly">High ratings only (4+)</label>
                </div>
            </div>
        </form>

        <div id="reviewsContainer"><p class="text-muted">Enter a book id above to load its reviews.</p></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="reviews.js"></script>

    <script>
        const token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "../login.html";
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "../login.html";
        }
    </script>

</body>
</html>

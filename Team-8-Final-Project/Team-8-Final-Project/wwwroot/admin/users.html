<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand mb-0 h1">Library Management System - Admin</span>
        <button class="btn btn-outline-light" onclick="logout()">Log out</button>
    </nav>

    <div class="container mt-4">
        <a href="../staff/dashboard.html" class="btn btn-link ps-0">&larr; Back to staff dashboard</a>
        <h1>Manage Users</h1>

        <div id="usersBanner"></div>
        <div id="usersContainer"><p class="text-muted">Loading users...</p></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="users.js"></script>

    <script>
        const token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "../login.html";
        }
        // Extra guard - this page is Admin-only, a Librarian shouldn't land here
        if (getUserRole() !== "Admin") {
            alert("This page is for Admins only.");
            window.location.href = "../staff/dashboard.html";
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "../login.html";
        }
    </script>

</body>
</html>

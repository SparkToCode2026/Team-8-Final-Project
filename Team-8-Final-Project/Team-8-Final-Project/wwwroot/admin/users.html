<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand mb-0 h1">Library Management System - Admin</span>
        <button class="btn btn-outline-light" onclick="logout()">Log out</button>
    </nav>

    <div class="container mt-4">
        <a href="../staff/dashboard.html" class="btn btn-link ps-0">&larr; Back to staff dashboard</a>
        <h1>Manage Users</h1>

        <div id="usersBanner"></div>

        <div id="usersCounts" class="fs-5 mb-2"></div>

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
            <div class="btn-group" role="group" id="roleFilterGroup">
                <button type="button" class="btn btn-outline-secondary active" data-role="All">All</button>
                <button type="button" class="btn btn-outline-secondary" data-role="Member">Members</button>
                <button type="button" class="btn btn-outline-secondary" data-role="Librarian">Librarians</button>
                <button type="button" class="btn btn-outline-secondary" data-role="Admin">Admins</button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="4" class="text-muted">Loading users...</td></tr>
                </tbody>
            </table>
        </div>
        <p id="usersEmptyMessage" class="text-muted d-none">No users match this filter.</p>
        <div class="text-center mb-4">
            <button type="button" id="loadMoreUsersBtn" class="btn btn-outline-secondary d-none">Load more</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="users.js"></script>

    <script>
        const token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "../login.html";
        }
        // Extra guard - this page is Admin-only, a Librarian shouldn't land here
        if (getUserRole() !== "Admin") {
            alert("This page is for Admins only.");
            window.location.href = "../staff/dashboard.html";
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "../login.html";
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <!-- Same navbar as dashboard.html - every member page repeats this block -->
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand mb-0 h1">Library Management System</span>
        <button class="btn btn-outline-light" onclick="logout()">Log out</button>
    </nav>

    <div class="container mt-4">
        <a href="dashboard.html" class="btn btn-link ps-0">&larr; Back to dashboard</a>

        <!-- Filled in by loadBookDetails() in book-details.js -->
        <div id="bookDetails">
            <p class="text-muted">Loading book...</p>
        </div>

        <hr class="my-4">

        <h3>Reviews</h3>
        <div id="averageRating" class="mb-3"></div>

        <!-- Any logged-in member can post a review, not just staff -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Write a review</h5>
                <form id="addReviewForm">
                    <div class="mb-3">
                        <label for="rating" class="form-label">Rating (1-5)</label>
                        <input type="number" class="form-control" id="rating" min="1" max="5" required>
                    </div>
                    <div class="mb-3">
                        <label for="comment" class="form-label">Comment</label>
                        <textarea class="form-control" id="comment" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit review</button>
                </form>
            </div>
        </div>

        <!-- Filled in by loadReviews() in book-details.js -->
        <div id="reviewsContainer">
            <p class="text-muted">Loading reviews...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="book-details.js"></script>

    <script>
        // Auth guard - same pattern as dashboard.html
        const token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "../login.html";
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "../login.html";
        }
    </script>

</body>
</html>
